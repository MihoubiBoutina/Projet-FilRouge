<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <style>text{font-family:Arial,sans-serif;font-size:20px;fill:#17202a}.box{fill:#eaf2f8;stroke:#2874a6;stroke-width:2}.control{fill:#fcf3cf;stroke:#b7950b;stroke-width:2}.arrow{stroke:#34495e;stroke-width:3;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#34495e"/></marker></defs>
  <rect class="box" x="30" y="190" width="170" height="90" rx="8"/><text x="62" y="242">Branche</text><text x="62" y="268">feature/*</text>
  <rect class="box" x="250" y="190" width="170" height="90" rx="8"/><text x="282" y="242">Pull Request</text><text x="282" y="268">description</text>
