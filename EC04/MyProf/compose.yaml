services:
  # 1. Base de données MySQL
  db:
    image: mysql:8.0
    container_name: symfony_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secu
      MYSQL_DATABASE: myprof_db
      MYSQL_USER: symfony_user
      MYSQL_PASSWORD: symfony_password_secu
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - symfony_network

  # 2. Votre application Symfony (Votre Image de Production GHCR)
  php:
    image: ghcr.io/mihoubiboutina/projet-filrouge:latest
    container_name: symfony_app
    restart: always
    environment:
      DATABASE_URL: "mysql://symfony_user:symfony_password_secu@db:3306/myprof_db?serverVersion=8.0.32&charset=utf8mb4"
      APP_ENV: prod
      APP_SECRET: a_very_secret_string_change_me_in_prod
    depends_on:
      - db
    networks:
      - symfony_network

  # 3. Serveur Web Nginx
  web:
    image: nginx:alpine
    container_name: symfony_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    volumes_from:
      - php
    depends_on:
      - php
    networks:
      - symfony_network

volumes:
  mysql_data:

networks:
  symfony_network:
    driver: bridge