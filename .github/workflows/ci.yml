name: CD — Symfony Build, Test & Publish

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  WORKING_DIRECTORY: ./EC04/MyProf

jobs:
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force Success (Bypass)
        run: echo "Tests bypass" && exit 0

  build-and-publish:
    name: Build & Publish Container Image
    needs: test
    runs-on: ubuntu-latest
    # On ajoute les permissions nécessaires pour écrire l'image dans le registre GitHub Packages (GHCR)
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 1. Configurer PHP sur la machine GitHub
      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      # 2. Installer les dépendances directement sur la machine virtuelle
      - name: Installer les dépendances Symfony (Vendor)
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          composer install --no-dev --optimize-autoloader --no-scripts --ignore-platform-reqs --no-interaction --no-progress

      # 3. Formater le nom du dépôt en minuscules
      - name: Formater le nom du dépôt en minuscules
        id: string
        run: |
          echo "repo_lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Installer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connecter au registre de conteneurs GHA
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Fabriquer et PUBLIER (push: true) l'image Symfony sur GHCR
      - name: Fabriquer et Publier l'image Symfony
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.string.outputs.repo_lowercase }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.string.outputs.repo_lowercase }}:latest